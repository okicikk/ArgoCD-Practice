apiVersion: apps/v1
kind: Deployment
metadata:
  name: oki-demo-app
  labels:
    app: oki-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-nginx
  template:
    metadata:
      labels:
        app: my-nginx
    spec:
      containers:
      - name: oki-demo
        image: okay03/oki-demo:14
        imagePullPolicy: Always
        ports:
        - containerPort: 80
